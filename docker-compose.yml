# version removed (deprecated)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skishop-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/skishop
      SPRING_DATASOURCE_USERNAME: skishop
      SPRING_DATASOURCE_PASSWORD: skishop
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      SPRING_MAIL_HOST: localhost
      SPRING_MAIL_PORT: 25
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    platform: linux/amd64
    container_name: skishop-db
    environment:
      POSTGRES_DB: skishop
      POSTGRES_USER: skishop
      POSTGRES_PASSWORD: skishop
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 初回起動時にスキーマ＆データを投入
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skishop"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
