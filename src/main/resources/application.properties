# Server
server.port=8080

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# DataSource (PostgreSQL via HikariCP)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skishop}
spring.datasource.username=${DB_USER:skishop}
spring.datasource.password=${DB_PASSWORD:skishop}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_ACTIVE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MAX_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_MAX_WAIT:30000}

# Database Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Logging
logging.level.root=INFO
logging.level.com.skishop=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{reqId}] %-5level %logger{36} - %msg%n

# Mail
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:no-reply@skishop.local}

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# UTF-8 encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
