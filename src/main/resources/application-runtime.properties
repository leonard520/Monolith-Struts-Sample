# Runtime validation profile — uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:skishop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep schema/data init from default profile
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Mail (no-op for runtime validation)
spring.mail.host=localhost
spring.mail.port=25
app.mail.from=test@skishop.com
